
ممتاز، الآن ظهرت لك صفحة Choose a workflow.

⚠️ لا تختار Jekyll ولا أي خيار من الخيارات الموجودة.

نحن نريد إعداد GitHub Pages لموقعك بطريقة بسيطة.

اضغط على:

Skip this and set up a workflow yourself

بعدها ستفتح لك صفحة فيها ملف اسمه غالبًا main.yml.

لا تغيّر أي شيء الآن، فقط اضغط عليها وأخبرني ماذا ظهر لك.


ظهرت

ممتاز 👍 الآن أنت في صفحة إنشاء ملف الـWorkflow.

لا تضغط Save أو Commit الآن.

أرسل لي فقط أول سطرين أو ثلاثة مما يظهر داخل مربع الكود، أو اكتب لي ماذا يظهر فوق مربع الكود، وسأقول لك بالضبط ماذا نضع فيه.


مربع الكود فارغ

تمام 👍 هذا طبيعي، لأنك اخترت Blank workflow.

الآن سنضع الكود داخل المربع.

انسخ هذا الكود كاملًا والصقه في مربع الكود:

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
